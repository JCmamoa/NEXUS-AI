[package]
name = "nexus-os"
version = "0.1.0"
description = "NEXUS OS — local-first operational command center"
authors = ["NEXUS OS"]
edition = "2021"

[lib]
name = "nexus_os_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["clock"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
